name: SamadhanX CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-quality:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samadhanx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        working-directory: backend
        run: |
          ruff check .

      - name: Run Ruff Formatter Check
        working-directory: backend
        run: |
          ruff format --check .

      - name: Run Pytest Suite
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-chars-long-example-value
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/samadhanx_test
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/samadhanx_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest -v --cov=app --cov-report=term-missing

  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Run ESLint
        working-directory: frontend
        run: |
          npm run lint

      - name: TypeScript Type Check
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Build Frontend Bundle
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm run build
