services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: samadhanx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-samadhanx}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-samadhanx}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - samadhanx_net

  redis:
    image: redis:7-alpine
    container_name: samadhanx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - samadhanx_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: samadhanx-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-samadhanx}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-samadhanx}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-samadhanx-dev-secret-key-do-not-use-in-production-min-32-chars}
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - AI_MODEL=${AI_MODEL:-openai/gpt-oss-20b}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.groq.com/openai/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-2}
      - AI_MAX_INPUT_LENGTH=${AI_MAX_INPUT_LENGTH:-6000}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-1200}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0}
      - AI_CONFIDENCE_THRESHOLD=${AI_CONFIDENCE_THRESHOLD:-0.70}
      - AI_SPAM_REVIEW_THRESHOLD=${AI_SPAM_REVIEW_THRESHOLD:-0.80}
      - AI_HIGH_RISK_THRESHOLD=${AI_HIGH_RISK_THRESHOLD:-0.70}
      - AI_MANUAL_REANALYSIS_ENABLED=${AI_MANUAL_REANALYSIS_ENABLED:-true}
      - AI_MANUAL_REANALYSIS_COOLDOWN_SECONDS=${AI_MANUAL_REANALYSIS_COOLDOWN_SECONDS:-60}
      - AI_PROMPT_VERSION=${AI_PROMPT_VERSION:-v1}
      - AI_CACHE_MODE=${AI_CACHE_MODE:-read_through}
      - AI_DEBUG=${AI_DEBUG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - samadhanx_net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: samadhanx-celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-samadhanx}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-samadhanx}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-samadhanx-dev-secret-key-do-not-use-in-production-min-32-chars}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - AI_MODEL=${AI_MODEL:-openai/gpt-oss-20b}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.groq.com/openai/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-2}
      - AI_MAX_INPUT_LENGTH=${AI_MAX_INPUT_LENGTH:-6000}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-1200}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0}
      - AI_CONFIDENCE_THRESHOLD=${AI_CONFIDENCE_THRESHOLD:-0.70}
      - AI_SPAM_REVIEW_THRESHOLD=${AI_SPAM_REVIEW_THRESHOLD:-0.80}
      - AI_HIGH_RISK_THRESHOLD=${AI_HIGH_RISK_THRESHOLD:-0.70}
      - AI_MANUAL_REANALYSIS_ENABLED=${AI_MANUAL_REANALYSIS_ENABLED:-true}
      - AI_MANUAL_REANALYSIS_COOLDOWN_SECONDS=${AI_MANUAL_REANALYSIS_COOLDOWN_SECONDS:-60}
      - AI_PROMPT_VERSION=${AI_PROMPT_VERSION:-v1}
      - AI_CACHE_MODE=${AI_CACHE_MODE:-read_through}
      - AI_DEBUG=${AI_DEBUG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - samadhanx_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: samadhanx-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8001}/api/v1
      - BACKEND_PROXY_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - samadhanx_net

volumes:
  postgres_data:
    name: samadhanx_postgres_data
  redis_data:
    name: samadhanx_redis_data
  frontend_node_modules:
    name: samadhanx_frontend_node_modules

networks:
  samadhanx_net:
    name: samadhanx_network
    driver: bridge
